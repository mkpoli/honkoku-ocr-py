[project]
name = "honkoku-ocr-py"
version = "0.1.0"
description = "みんなで翻刻OCR の行認識・レイアウト認識を Python (onnxruntime) で動かす移植版"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md", "LICENSES/*"]
authors = [{ name = "mkpoli" }]
dependencies = ["numpy>=1.26", "pillow>=10", "httpx>=0.27"]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.20"]
gpu = ["onnxruntime-gpu>=1.20", "nvidia-cudnn-cu12", "nvidia-cublas-cu12", "nvidia-cuda-runtime-cu12", "nvidia-cuda-nvrtc-cu12", "nvidia-cufft-cu12", "nvidia-curand-cu12"]
dev = ["pytest>=8"]

[project.scripts]
honkoku-ocr = "honkoku_ocr.cli:main"

[project.urls]
Homepage = "https://github.com/mkpoli/honkoku-ocr-py"
Upstream = "https://github.com/yuta1984/honkoku-ocr-web"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["honkoku_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
