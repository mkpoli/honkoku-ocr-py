[project]
name = "honkoku-ocr-py"
version = "0.3.0"
description = "みんなで翻刻OCR の行認識・レイアウト認識を Python (onnxruntime) で動かす移植版"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md", "LICENSES/*"]
authors = [{ name = "mkpoli" }]
dependencies = ["numpy>=1.26", "pillow>=10", "httpx>=0.27", "onnx>=1.17"]

[project.optional-dependencies]
cpu = [
  "onnxruntime>=1.21,<1.24; python_version < '3.11'",
  "onnxruntime>=1.21; python_version >= '3.11'",
]
gpu = [
  "onnxruntime-gpu>=1.21,<1.24; python_version < '3.11'",
  "onnxruntime-gpu>=1.21; python_version >= '3.11'",
  "nvidia-cudnn-cu12", "nvidia-cublas-cu12", "nvidia-cuda-runtime-cu12", "nvidia-cuda-nvrtc-cu12", "nvidia-cufft-cu12", "nvidia-curand-cu12",
]
pdf = ["pypdfium2>=4"]

[project.scripts]
honkoku-ocr = "honkoku_ocr.cli:main"

[project.urls]
Homepage = "https://github.com/mkpoli/honkoku-ocr-py"
Upstream = "https://github.com/yuta1984/honkoku-ocr-web"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["honkoku_ocr"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pypdfium2>=4"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E9", "F", "B", "UP", "I"]
